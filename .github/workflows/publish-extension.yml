name: Publish Extension

on:
  # 推送 v* 开头的 tag 时自动触发
  push:
    tags:
      - 'v*'
  # 支持手动触发
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Build & Publish to Chrome Web Store
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: packages/browser-extension/package-lock.json

      - name: Install dependencies
        working-directory: packages/browser-extension
        run: npm ci

      - name: Extract version from tag
        id: version
        run: |
          # 从 tag 名提取版本号（v1.0.0 → 1.0.0）
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG_NAME#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Publishing version: $VERSION"

      - name: Sync version to package.json
        working-directory: packages/browser-extension
        run: |
          # 确保 package.json 版本号与 tag 一致
          npm version ${{ steps.version.outputs.version }} --no-git-tag-version --allow-same-version

      - name: Build extension
        working-directory: packages/browser-extension
        run: npm run build
        env:
          NODE_ENV: production

      - name: Verify manifest
        run: |
          # 验证 manifest.json 存在且 version 正确
          MANIFEST="packages/browser-extension/.output/chrome-mv3/manifest.json"
          if [ ! -f "$MANIFEST" ]; then
            echo "Error: manifest.json not found at $MANIFEST"
            exit 1
          fi
          VERSION=$(jq -r '.version' "$MANIFEST")
          echo "Manifest version: $VERSION"
          if [ "$VERSION" != "${{ steps.version.outputs.version }}" ]; then
            echo "Error: version mismatch. Expected ${{ steps.version.outputs.version }}, got $VERSION"
            exit 1
          fi

      - name: Package extension
        working-directory: packages/browser-extension/.output/chrome-mv3
        run: |
          # 打包 zip（manifest.json 必须在根目录）
          zip -r ../../accessaudit-${{ steps.version.outputs.version }}.zip . \
            -x "*.DS_Store" -x "__MACOSX*"
          cd ../..
          echo "Package contents:"
          unzip -l accessaudit-${{ steps.version.outputs.version }}.zip | head -20

      - name: Upload to Chrome Web Store
        uses: wdzeng/chrome-extension@v2
        with:
          extension-id: ${{ secrets.CWS_EXTENSION_ID }}
          client-id: ${{ secrets.CWS_CLIENT_ID }}
          client-secret: ${{ secrets.CWS_CLIENT_SECRET }}
          refresh-token: ${{ secrets.CWS_REFRESH_TOKEN }}
          zip-path: packages/browser-extension/accessaudit-${{ steps.version.outputs.version }}.zip
          # upload: 仅上传，不自动发布（可手动在 Dashboard 审核）
          # uploadPublish: 上传并自动提交发布
          action: uploadPublish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: accessaudit-${{ steps.version.outputs.version }}
          path: packages/browser-extension/accessaudit-${{ steps.version.outputs.version }}.zip
          retention-days: 30
